[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatbot"
version = "0.1.0"
description = "Synthetic legal-document generator for AI training data (Phase 1)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agentlightning>=0.3.0",
    "lxml>=6.0.2",
    "mirascope>=2.2.2",
    "openai>=2.21.0",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
    "rich>=13.7.1",
    "typer>=0.24.0",
]

[project.scripts]
chatbot = "chatbot.cli:app"
chatbot-console = "chatbot_console.api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot", "src/chatbot_console"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",           # Modern linter/formater which replaces Black/Flake8
    "mypy>=1.9.0",           # For strict type check
]

# Configurartion for the Ruff (Linter and Formater)
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # Osnovne greške, importi, moderne Python funkcije
