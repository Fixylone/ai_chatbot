# Phase 1 — Synthetic Data Generation Configuration
# Override with env vars (CHATBOT_* prefix) or CLI flags.

# LLM models (mirascope format: "provider/model-name")
toc_model: "openai/gpt-4o" # TOC generation (reasoning-capable)
section_model: "openai/gpt-4o-mini" # Section content (cost-effective)
ideation_model: "openai/gpt-4o" # Tool ideation (creative)

# Sampling
toc_temperature: 0.8
section_temperature: 0.7
ideation_temperature: 0.9
top_p: 0.95

# Scope (total docs = num_tools × docs_per_tool)
num_tools: 5
docs_per_tool: 4
document_types:
  - "Privacy Policy"
  - "Terms of Service"
  - "Data Processing Agreement"
  - "Service Level Agreement"
  - "Security Whitepaper"
  - "Compliance & Certifications"

# Reproducibility
seed: 42

# Output directory (relative to project root)
output_dir: "data"
