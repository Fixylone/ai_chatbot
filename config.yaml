# Phase 1 — Synthetic Data Generation Configuration
# Override with env vars (CHATBOT_* prefix) or CLI flags.

# LLM models (IDs supported by your gateway)
toc_model: "openai/l2-gpt-4.1-nano" # TOC generation (reasoning-focused)
section_model: "openai/l2-gpt-4.1-mini" # Section content (cost-effective)
ideation_model: "openai/l2-gpt-4.1-nano" # Tool ideation (creative)

# Sampling
toc_temperature: 0.3
section_temperature: 0.5
ideation_temperature: 0.9
top_p: 0.95

# Scope (total docs = num_tools × docs_per_tool)
num_tools: 5
docs_per_tool: 4
document_types:
  - "Privacy Policy"
  - "Terms of Service"
  - "Data Processing Agreement"
  - "Service Level Agreement"
  - "Security Whitepaper"
  - "Compliance & Certifications"

# Runtime retry strategy
rate_limit_max_retries: 3
rate_limit_base_backoff_seconds: 2.0
rate_limit_max_backoff_seconds: 60.0

# Adaptive RPM pacing — requests per minute limit
rpm_limit: 60
# Minimum floor delay between section calls (adaptive pacer adds more if needed)
section_delay_seconds: 0.0

# Section context compression controls
section_summary_max_chars: 6000
section_last_section_max_chars: 5000

# Output directory (relative to project root)
output_dir: "data"
