template: |
  Tool context:
  - Name: {tool_name}
  - Purpose: {tool_purpose}
  - Category: {tool_category}
  - Typical users: {tool_user_base}

  Document context:
  - Type: {document_type}

  Full TOC JSON:
  {toc_json}

  Issue injection:
  - Inject issue: {inject_issue}
  - Issue label: {required_issue_label}
  - Output contract: return issue_sentence="none" when inject_issue is "no"; otherwise return the exact sentence from html_content containing the injected issue.

  Previously generated sections (full HTML):
  {previous_sections_html}

  Current section target:
  - Section id: {section_id}
  - Section title: {section_title}

  Generate only the target section content as HTML.
