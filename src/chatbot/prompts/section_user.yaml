template: |
  Tool context:
  - Name: {tool_name}
  - Purpose: {tool_purpose}
  - Category: {tool_category}
  - Typical users: {tool_user_base}

  Document context:
  - Type: {document_type}

  Full TOC JSON:
  {toc_json}

  Quality controls for this document:
  - Required total injected issues across the full document: {target_issue_range}
  - Target total issue count for this document: {target_issue_total}
  - Required issue count for this section: {required_issue_count}
  - Required issue label for this section: {required_issue_label}
  - Allowed issue labels are exactly:
    - contradictory_clause
    - ambiguous_language
    - minor_typo_or_formatting
    - inconsistent_terminology_or_cross_reference
  - If required issue count is 0, return issues_applied as [] and do not inject a new issue.
  - If required issue count is 1, return issues_applied exactly as ["{required_issue_label}"].
  - Use the actual tool name "{tool_name}" in prose; do not output placeholders such as [CompanyName] or [Company Name].
  - Keep this section substantial (typically 2-4 paragraphs unless naturally shorter).

  Previous sections summary (compressed):
  {previous_sections_summary}

  Last full section HTML:
  {last_full_section_html}

  Current section target:
  - Target section id: {section_id}
  - Target section title: {section_title}

  Generate only the target section content as HTML.
